name: Crypto News Bot

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Жестко задаем права на запись

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Обновили до актуальной версии
        with:
          ref: main # Строго привязываемся к ветке main

      - name: Set up Python
        uses: actions/setup-python@v5 # Обновили до актуальной версии
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run news parser
        run: python news_parser.py

      - name: Save memory (seen news)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_news.txt
          git commit -m "Update seen news memory" || echo "No changes to commit"
          git push origin main
